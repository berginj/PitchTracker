[pytest]
testpaths = tests
# Fail a hung test instead of blocking the whole run / CI indefinitely.
# Uses the thread method so it works on Windows where signals are unavailable.
timeout = 120
timeout_method = thread
markers =
    requires_no_offscreen: test needs a real display backend (codec probes fail under QT_QPA_PLATFORM=offscreen)
    requires_pytest_qt: test needs pytest-qt installed
