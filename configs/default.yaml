camera:
  width: 1280
  height: 720
  fps: 60
  pixfmt: GRAY8  # Options: GRAY8 (grayscale), YUYV (color), MJPG (compressed color)
  color_mode: true  # Set to true to capture color video (overrides pixfmt to YUYV)
  exposure_us: 2000
  gain: 0.0
  wb_mode: null
  wb: null
  queue_depth: 6
  flip_left: false  # Rotate left camera 180° if mounted upside down
  flip_right: false  # Rotate right camera 180° if mounted upside down
  # Camera type and capabilities (auto-detected during setup)
  type: null  # "webcam", "industrial", "unknown"
  has_autofocus: null  # true/false/null (auto-detected)
  focal_stability_score: null  # 0-100 (higher = more stable)
stereo:
  pairing_tolerance_ms: 8
  epipolar_epsilon_px: 3
  baseline_ft: 1.625  # 19.5 inches measured center-to-center
  focal_length_px: 1200.0
  cx: null
  cy: null
  z_min_ft: 3
  z_max_ft: 80
  max_jump_in: 12
  # Calibration metadata (set during calibration)
  calibration_mode: null  # "QUICK", "FULL"
  calibration_date: null  # ISO timestamp
  calibration_quality_rating: null  # "EXCELLENT", "GOOD", "ACCEPTABLE", "POOR"
  calibration_rms_error_px: null  # Reprojection error
  calibration_num_images: null  # Number of image pairs used
  # Online refinement state
  time_sync_offset_ns: 0  # Systematic time sync bias (refined online)
tracking:
  gate_distance_ft: 0.5
  min_track_frames: 20
metrics:
  coordinate_system: "X: catcher left-right, Y: vertical, Z: toward plate"
  plate_plane_z_ft: 0
  release_plane_z_ft: 50
  approach_window_ft: 5
  velo_bounds_mph: [30, 110]
  hb_bounds_in: [-30, 30]
  ivb_bounds_in: [-30, 30]
  release_height_bounds_ft: [1, 8]
  # Online refinement state
  online_refinement_enabled: true  # Enable automatic parameter refinement
  last_refinement_date: null  # ISO timestamp
  drag_k0_default: 0.1  # Default drag coefficient (refined online)
trajectory:
  primary_mode: stereo_3d        # stereo_3d | ray_reprojection | ray_graph
  compare_modes: []              # e.g. [stereo_3d, ray_reprojection, ray_graph]
  fallback_to_stereo: true
  ray:
    max_time_offset_ms: 20
    time_offset_prior_ms: 0
    min_rays_per_camera: 4
    max_candidates_per_frame: 2
    max_reprojection_px: 8
    robust_loss: huber
recording:
  pre_roll_ms: 500
  post_roll_ms: 500
  output_dir: recordings
  session_min_active_frames: 4
  session_end_gap_frames: 8
  # ML training data collection
  save_detections: false       # Export detection JSON files
  save_observations: false     # Export 3D trajectory points
  save_training_frames: false  # Save key frames as PNG
  frame_save_interval: 5       # Save every Nth frame
ui:
  refresh_hz: 15
telemetry:
  latency_p95_ms_warn: 500
detector:
  type: classical
  model_path: null
  model_input_size: [640, 640]
  model_conf_threshold: 0.25
  model_class_id: 0
  model_format: yolo_v5
  mode: MODE_A
  frame_diff_threshold: 18.0
  bg_diff_threshold: 12.0
  bg_alpha: 0.08
  edge_threshold: 32.0
  blob_threshold: 22.0
  runtime_budget_ms: 4.0
  crop_padding_px: 20
  min_consecutive: 1
  filters:
    min_area: 12
    max_area: null
    min_circularity: 0.1
    max_circularity: null
    min_velocity: 0.0
    max_velocity: null
strike_zone:
  batter_height_in: 66.0  # 5'6" default (was 72.0 = 6'0")
  top_ratio: 0.5
  bottom_ratio: 0.27
  plate_width_in: 17.0
  plate_length_in: 17.0
ball:
  type: baseball
  radius_in:
    baseball: 1.45
    softball: 1.88
upload:
  enabled: false
  swa_api_base: ""
  api_key: ""
# Calibration health monitoring
calibration_validation:
  enabled: true  # Monitor calibration health at runtime
  alert_threshold_px: 5.0  # Alert when epipolar error exceeds this
  recalibration_interval_days: 30  # Suggest recalibration every N days
  min_trajectories_for_refinement: 50  # Accumulate N trajectories before refining
