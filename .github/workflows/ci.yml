name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify schema mirror is in sync
        run: python scripts/sync_schema.py --check

      - name: Check public documentation links and terminology
        run: python scripts/check_public_docs.py

      - name: Enforce file-length convention
        run: python scripts/check_file_length.py

      - name: Lint with flake8
        run: flake8 . --count --statistics

      - name: Type check with mypy baseline ratchet
        # Mypy is a source-level gate. Run it once on the canonical 3.13
        # environment so newer interpreter-specific third-party stubs do not
        # create a second, non-comparable diagnostic baseline.
        if: matrix.python-version == '3.13'
        run: python scripts/check_mypy_baseline.py

      - name: Run tests
        # Native camera/Qt libraries are not safe to fan out to every CPU on
        # Windows. Two workers preserve parallel feedback without teardown and
        # file-replacement races seen with ``-n auto``. Python 3.14 currently
        # also crashes while importing NumPy in multiple xdist workers, so keep
        # that compatibility job serial while retaining full test coverage.
        shell: pwsh
        run: |
          if ('${{ matrix.python-version }}' -eq '3.14') {
            python -m pytest --tb=short -q
          } else {
            python -m pytest -n 2 --dist loadscope --tb=short -q
          }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Dependency vulnerability scan
        run: safety check -r requirements.txt --output text
        continue-on-error: true
