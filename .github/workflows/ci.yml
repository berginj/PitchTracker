name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify schema mirror is in sync
        run: python scripts/sync_schema.py --check

      - name: Enforce file-length convention
        run: python scripts/check_file_length.py

      - name: Lint with flake8
        run: flake8 . --count --statistics

      - name: Type check with mypy (advisory)
        run: mypy .
        continue-on-error: true

      - name: Run tests
        run: python -m pytest -n auto --dist loadscope --tb=short -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Dependency vulnerability scan
        run: safety check -r requirements.txt --output text
        continue-on-error: true
