name: Validation Report
description: Structured results from camera alignment, velocity, location, or setup validation.
title: "[Validation]: "
labels:
  - validation
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for controlled validation runs. Automated or plausible-looking
        output is not physical validation. Keep raw private media local unless the
        maintainer explicitly asks for an authorized private transfer. Write
        "not measured" when a value is unavailable.
  - type: dropdown
    id: validation_type
    attributes:
      label: Validation type
      options:
        - Camera alignment
        - Velocity accuracy
        - Location accuracy
        - Detection rate
        - Setup Doctor dry-run
        - Recording/replay integrity
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: PitchTracker version
      description: Use a release tag or commit SHA, not only a date or branch name.
      placeholder: v2.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: rig_profile
    attributes:
      label: Rig profile or setup identifier
      placeholder: test-rig-global-shutter-pair-2026-07
    validations:
      required: false
  - type: input
    id: setup_snapshot
    attributes:
      label: Setup snapshot ID and fingerprint
      description: Provide the ID and SHA-256 fingerprint, not private snapshot contents.
      placeholder: setup-... / sha256
    validations:
      required: false
  - type: textarea
    id: setup
    attributes:
      label: Test setup
      description: Camera models, stable identities or anonymized IDs, spacing, distance, lighting, ball type, requested/negotiated mode, and reference device. Omit private facility details.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Protocol
      description: "Explain what you planned before collecting data: number of cases, procedure, warm-up handling, target grid or setup stages, strata, thresholds, and exclusions."
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Include the measured values and units, such as MAE, confidence interval, detection rate, alignment quality, or pass/warn/critical status. Keep raw and corrected values separate.
    validations:
      required: true
  - type: textarea
    id: denominators
    attributes:
      label: Counts and denominators
      description: "Include attempted, accepted, rejected, unmatched, excluded, and reference-missing counts. Example: 146 paired frames out of 151 opportunities."
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Failures or anomalies
      description: Missed detections, calibration warnings, bad alignment, environmental changes, or excluded samples.
    validations:
      required: false
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: List privacy-safe filenames, hashes, screenshots, setup IDs, or anonymized summaries. Avoid absolute paths containing usernames and do not attach raw media, calibration files, or secrets.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed athlete names/media, raw serials, secrets, absolute private paths, and sensitive facility data unless explicitly authorized.
          required: true
