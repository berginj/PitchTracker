[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
namespace_packages = True
explicit_package_bases = True
exclude = (^|[\\/])(\.venv|venv|build|dist|archive|__pycache__|\.pytest_cache|\.mypy_cache|examples)([\\/])

# Gradually enable stricter checks for new code
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Tests intentionally use structural fakes, monkeypatch method replacement,
# malformed boundary payloads, and optional hardware APIs. Keep them in the
# repository-wide run for parsing/name/type-policy coverage while leaving
# behavioral compatibility to pytest. The policy checker fixes this list so it
# cannot silently expand.
[mypy-tests.*]
disable_error_code = arg-type, attr-defined, union-attr, call-arg, var-annotated, operator, index, no-any-return, method-assign, comparison-overlap, list-item, return-value, func-returns-value, dict-item, has-type, misc, call-overload, import-not-found, assignment

# Ignore missing stubs for third-party libraries
[mypy-cv2]
ignore_missing_imports = True
follow_imports = skip

[mypy-cv2.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-PySide6.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-loguru.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
