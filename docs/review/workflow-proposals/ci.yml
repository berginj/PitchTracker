name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify schema mirror is in sync
        run: python scripts/sync_schema.py --check

      - name: Enforce file-length convention
        run: python scripts/check_file_length.py

      - name: Lint with flake8
        run: flake8 . --count --statistics

      - name: Type check with mypy (advisory)
        run: mypy .
        continue-on-error: true

  # ── Offscreen UI lane ───────────────────────────────────────────────
  # Exercises Qt widget construction, accessibility, responsiveness, and
  # UI-dependent unit tests under offscreen rendering. Excludes tests
  # marked `requires_no_offscreen` (codec probes that fail without a
  # real display backend).
  test-ui:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run UI tests (offscreen)
        run: >
          python -m pytest
          -m "not requires_no_offscreen"
          -n auto --dist loadscope --tb=short -q

  # ── Non-offscreen codec / recording lane ────────────────────────────
  # Runs codec-probe and recording tests that require a real display
  # backend (or at least NOT offscreen). QT_QPA_PLATFORM is deliberately
  # unset so OpenCV VideoWriter can probe native codecs.
  test-codec:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run codec / recording tests (no offscreen)
        run: >
          python -m pytest
          -m "requires_no_offscreen"
          --tb=short -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.9.0

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
