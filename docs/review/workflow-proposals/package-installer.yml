name: Package Windows Installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to package
        required: true
        default: main

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Run release gates
        run: |
          python scripts/check_release_versions.py
          python scripts/sync_schema.py --check
          python scripts/check_file_length.py
          flake8 . --count --statistics
          python -m pytest -n auto --dist loadscope --tb=short -q

      - name: Build installer
        shell: pwsh
        run: .\build_installer.ps1 -Clean

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer_output\PitchTracker-Setup-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not produced."
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload unsigned smoke-test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitchtracker-installer-${{ github.run_id }}
          path: |
            installer_output\PitchTracker-Setup-*.exe
            installer_output\PitchTracker-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
